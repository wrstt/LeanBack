name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/LeanBack.WinUI/LeanBack.WinUI.csproj

      - name: Build
        run: dotnet build src/LeanBack.WinUI/LeanBack.WinUI.csproj -c Release --no-restore
